<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DEPOT. by siahaan22</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ffe6f0 0%, #ffc1e3 100%);
            height: 100dvh; 
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .chat-container {
            width: 100%;
            max-width: 420px;
            height: 100dvh; 
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 10;
        }

        @media (min-width: 450px) {
            .chat-container {
                height: 90vh;
                border-radius: 24px;
                border: 1px solid rgba(255, 255, 255, 0.7);
                box-shadow: 0 10px 40px rgba(216, 27, 96, 0.15);
            }
        }

        header {
            background: rgba(255, 255, 255, 0.6);
            padding: 12px 20px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header .spacer { width: 35px; }

        header .title-box h1 {
            font-size: 1.25rem;
            color: #d81b60;
            font-weight: 600;
            letter-spacing: 0.5px;
            line-height: 1.2;
        }

        header .title-box span {
            font-size: 0.75rem;
            color: #ec407a;
            font-weight: 400;
            opacity: 0.8;
        }

        .menu-btn {
            background: none;
            border: none;
            cursor: pointer;
            width: 35px;
            height: 35px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 8px;
            transition: 0.2s;
        }

        .menu-btn:hover { background: rgba(216, 27, 96, 0.1); }
        .menu-btn svg { fill: #d81b60; width: 24px; height: 24px; }

        .chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }

        .chat-box::-webkit-scrollbar { width: 4px; }
        .chat-box::-webkit-scrollbar-thumb {
            background: rgba(216, 27, 96, 0.15);
            border-radius: 10px;
        }

        .message {
            max-width: 82%;
            padding: 12px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            line-height: 1.5;
            word-wrap: break-word;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .user-msg {
            background: linear-gradient(135deg, #e91e63 0%, #d81b60 100%);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .ai-msg {
            background: #ffffff;
            color: #444;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .loading {
            align-self: flex-start;
            font-size: 0.8rem;
            color: #d81b60;
            font-style: italic;
            display: none;
            padding: 0 20px;
            margin-bottom: 12px;
            opacity: 0.7;
        }

        .input-area {
            padding: 12px 16px;
            padding-bottom: calc(12px + env(safe-area-inset-bottom)); 
            background: rgba(255, 255, 255, 0.7);
            border-top: 1px solid rgba(255, 255, 255, 0.6);
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .input-area input {
            flex: 1;
            padding: 14px 20px;
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.9);
            outline: none;
            color: #333;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.02);
        }

        .input-area input:focus { box-shadow: 0 0 0 2px rgba(216, 27, 96, 0.2); }

        .send-btn {
            background: linear-gradient(135deg, #e91e63 0%, #d81b60 100%);
            color: white;
            border: none;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.2s, box-shadow 0.2s;
            flex-shrink: 0;
            box-shadow: 0 4px 12px rgba(216, 27, 96, 0.25);
        }

        .send-btn:active { transform: scale(0.95); }
        .send-btn svg { width: 20px; height: 20px; fill: white; margin-left: 2px; }

        /* MODAL MENU OVERLAY */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100dvh;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(3px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: 0.3s ease;
        }

        .modal-overlay.active { opacity: 1; pointer-events: all; }

        .modal-content {
            background: white;
            padding: 24px;
            border-radius: 20px;
            text-align: center;
            width: 80%;
            max-width: 320px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            transform: translateY(-20px) scale(0.95);
            transition: 0.3s ease;
        }

        .modal-overlay.active .modal-content { transform: translateY(0) scale(1); }

        .modal-content h3 {
            color: #d81b60;
            margin-bottom: 8px;
            font-size: 1.15rem;
        }

        .modal-content p {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 16px;
            line-height: 1.5;
        }

        .modal-content .ig-link {
            font-weight: 600;
            color: #e91e63;
            font-size: 1rem;
            text-decoration: none;
            display: inline-block;
            margin-top: 4px;
            padding: 2px 6px;
            border-radius: 6px;
            transition: all 0.2s ease;
        }

        .modal-content .ig-link:hover {
            background: rgba(233, 30, 99, 0.1);
            color: #c2185b;
        }

        /* Desain Dropdown Bahasa */
        .lang-container {
            margin-bottom: 20px;
            text-align: left;
        }

        .lang-container label {
            font-size: 0.85rem;
            color: #555;
            font-weight: 500;
            display: block;
            margin-bottom: 6px;
        }

        .lang-container select {
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid #ddd;
            font-size: 0.9rem;
            color: #333;
            outline: none;
            background: #f9f9f9;
            transition: border 0.2s;
        }

        .lang-container select:focus {
            border-color: #d81b60;
        }

        .btn-clear {
            background: #ff4757;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 12px;
            width: 100%;
            font-size: 0.95rem;
            cursor: pointer;
            margin-bottom: 10px;
            font-weight: 500;
        }
        
        .btn-close {
            background: #f1f2f6;
            color: #333;
            border: none;
            padding: 12px;
            border-radius: 12px;
            width: 100%;
            font-size: 0.95rem;
            cursor: pointer;
            font-weight: 500;
        }

        /* EFEK PARTIKEL */
        .particle {
            position: fixed;
            top: -10vh;
            pointer-events: none;
            z-index: 20; 
            opacity: 0.8;
            animation: fall linear forwards;
        }
        .sakura { font-size: 1.2rem; filter: drop-shadow(0 0 2px rgba(255, 105, 180, 0.4)); }
        .love { font-size: 0.8rem; opacity: 0.4; }

        @keyframes fall {
            0% { transform: translateY(0) rotate(0deg) translateX(0); }
            100% { transform: translateY(110vh) rotate(360deg) translateX(30px); }
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <header>
            <div class="spacer"></div>
            <div class="title-box">
                <h1>DEPOT.</h1>
                <span>by siahaan22</span>
            </div>
            <button class="menu-btn" onclick="toggleMenu()">
                <svg viewBox="0 0 24 24"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
            </button>
        </header>
        
        <div class="chat-box" id="chat-box">
            <div class="message ai-msg">Halo! Saya DEPOT. Ada yang bisa saya bantu hari ini?</div>
        </div>
        
        <div class="loading" id="loading">Mengetik balasan...</div>
        
        <div class="input-area">
            <input type="text" id="user-input" placeholder="Ketik pesan Anda di sini..." onkeypress="handleEnter(event)">
            <button class="send-btn" onclick="sendMessage()">
                <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg>
            </button>
        </div>
    </div>

    <div class="modal-overlay" id="menu-modal">
        <div class="modal-content">
            <h3>Pilihan</h3>
            <p>Developer AI: <br>
                <a href="https://www.instagram.com/dev.arthsy14?igsh=MWZhN2xwNWQ5ZHN4" target="_blank" class="ig-link">@dev.arthsy14</a>
            </p>
            
            <div class="lang-container">
                <label for="lang-select">Bahasa AI (AI Language):</label>
                <select id="lang-select" onchange="changeLanguage()">
                    <option value="id">Indonesia</option>
                    <option value="en">English</option>
                    <option value="ko">한국어 (Korean)</option>
                    <option value="ja">日本語 (Japanese)</option>
                </select>
            </div>

            <button class="btn-clear" onclick="clearChat()">Hapus Riwayat Chat</button>
            <button class="btn-close" onclick="toggleMenu()">Tutup Menu</button>
        </div>
    </div>

    <script>
        const API_KEY = "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";
        const API_URL = "https://api.groq.com/openai/v1/chat/completions";

        // Daftar prompt profesional sesuai bahasa yang dipilih tanpa typo
        const systemPrompts = {
            id: "Anda adalah asisten AI profesional bernama DEPOT, diciptakan oleh siahaan22. Pemilik Anda memiliki akun Instagram di @dev.arthsy14. Jawablah setiap pertanyaan dengan bahasa Indonesia yang baku, sopan, formal, profesional, dan pastikan tidak ada kesalahan ketik (typo).",
            en: "You are a professional AI assistant named DEPOT, created by siahaan22. Your owner has an Instagram account at @dev.arthsy14. Answer every question in formal, polite, professional English, and ensure there are no typographical errors.",
            ko: "당신은 siahaan22가 만든 DEPOT이라는 이름의 전문적인 AI 어시스턴트입니다. 소유자의 인스타그램 계정은 @dev.arthsy14입니다. 모든 질문에 정중하고 전문적인 한국어로 대답하고 오타가 없도록 하십시오.",
            ja: "あなたはsiahaan22によって作成されたDEPOTという名前のプロフェッショナルなAIアシスタントです。所有者のInstagramアカウントは@dev.arthsy14です。すべての質問に丁寧でプロフェッショナルな日本語で答え、誤字脱字がないようにしてください。"
        };

        let chatHistory = [
            { role: "system", content: systemPrompts["id"] }
        ];

        const menuModal = document.getElementById('menu-modal');
        function toggleMenu() {
            menuModal.classList.toggle('active');
        }

        // Fungsi mengubah bahasa AI di tengah obrolan
        function changeLanguage() {
            const lang = document.getElementById('lang-select').value;
            chatHistory[0].content = systemPrompts[lang]; // Update instruksi bahasa ke AI

            // Tampilkan notifikasi bahasa ke pengguna
            let notice = "";
            if(lang === 'id') notice = "Pengaturan bahasa diubah ke Indonesia. Silakan bertanya.";
            if(lang === 'en') notice = "Language changed to English. How can I assist you?";
            if(lang === 'ko') notice = "언어가 한국어로 변경되었습니다. 무엇을 도와드릴까요?";
            if(lang === 'ja') notice = "言語が日本語に変更されました。ご用件は何でしょうか？";
            
            appendMessage(notice, 'ai');
            toggleMenu(); // Tutup menu otomatis setelah memilih
        }

        function clearChat() {
            const lang = document.getElementById('lang-select').value;
            
            chatHistory = [
                { role: "system", content: systemPrompts[lang] }
            ];

            let greeting = "";
            if(lang === 'id') greeting = "Halo! Saya DEPOT. Ada yang bisa saya bantu hari ini?";
            if(lang === 'en') greeting = "Hello! I am DEPOT. How can I assist you today?";
            if(lang === 'ko') greeting = "안녕하세요! 저는 DEPOT입니다. 오늘 무엇을 도와드릴까요?";
            if(lang === 'ja') greeting = "こんにちは！私はDEPOTです。今日はどのようなご用件でしょうか？";

            document.getElementById('chat-box').innerHTML = `<div class="message ai-msg">${greeting}</div>`;
            toggleMenu();
        }

        function createParticle(type) {
            const particle = document.createElement('div');
            particle.classList.add('particle', type);
            particle.style.left = Math.random() * 100 + 'vw';
            particle.style.animationDuration = Math.random() * 6 + 6 + 's'; 
            particle.innerHTML = type === 'sakura' ? '🌸' : '🤍'; 
            document.body.appendChild(particle);
            setTimeout(() => particle.remove(), 12000);
        }
        setInterval(() => createParticle('sakura'), 1500);
        setInterval(() => createParticle('love'), 3500);

        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const loading = document.getElementById('loading');

        function handleEnter(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        function appendMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', sender === 'user' ? 'user-msg' : 'ai-msg');
            msgDiv.innerText = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            appendMessage(text, 'user');
            chatHistory.push({ role: "user", content: text });
            userInput.value = '';
            
            loading.style.display = 'block';
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${API_KEY}`
                    },
                    body: JSON.stringify({
                        model: "llama-3.1-8b-instant", 
                        messages: chatHistory
                    })
                });

                const data = await response.json();
                
                if (!response.ok) {
                    const errorMsg = data.error?.message || response.statusText;
                    appendMessage(`Gagal memproses (Error): ${errorMsg}`, 'ai');
                    chatHistory.pop();
                    return;
                }

                if (data.choices && data.choices.length > 0) {
                    const aiResponse = data.choices[0].message.content;
                    appendMessage(aiResponse, 'ai');
                    chatHistory.push({ role: "assistant", content: aiResponse });
                } else {
                    appendMessage("Maaf, respon dari server kosong.", 'ai');
                }
            } catch (error) {
                console.error("Fetch Error:", error);
                appendMessage("Gagal terhubung ke internet atau server API.", 'ai');
                chatHistory.pop();
            } finally {
                loading.style.display = 'none';
            }
        }
    </script>
</body>
</html>
